<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Smart Canteen</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="topbar">
    <h1>Smart Canteen</h1>
    <div id="userbar" class="hidden"><span id="who"></span><button id="logoutBtn" class="btn light">Sign Out</button></div>
  </header>
  <div id="toast" class="toast hidden"></div>

  <!-- Authentication -->
  <main id="authView" class="container narrow">
    <div class="card">
      <div class="tabs">
        <button class="tab active" data-auth="login">Sign In</button>
        <button class="tab" data-auth="signup">Sign Up</button>
      </div>
      <form id="authForm" autocomplete="off">
        <label>Account Type</label>
        <select id="role"><option value="STUDENT">Student</option><option value="ADMIN">Admin</option></select>
        <div id="nameRow" class="hidden"><label>Full Name</label><input id="name" type="text"></div>
        <label>Email</label><input id="email" type="email" required>
        <label>Password</label><input id="password" type="password" required minlength="6">
        <div id="codeRow" class="hidden"><label>Admin Code</label><input id="adminCode" type="text"></div>
        <button id="authBtn" class="btn primary full" type="submit">Sign In</button>
      </form>
    </div>
    <div class="card demo">
      <h3>Demo Credentials (for project evaluation)</h3>
      <table>
        <tr><th>Role</th><th>Email</th><th>Password</th><th></th></tr>
        <tr><td>Student</td><td>student@canteen.com</td><td>student123</td><td><button class="btn light small" data-fill="STUDENT|student@canteen.com|student123">Use</button></td></tr>
        <tr><td>Admin</td><td>admin@canteen.com</td><td>admin123</td><td><button class="btn light small" data-fill="ADMIN|admin@canteen.com|admin123">Use</button></td></tr>
      </table>
      <p class="note">Admin registration code (required to sign up as Admin): <strong>CANTEEN-ADMIN-2026</strong></p>
    </div>
  </main>

  <!-- Student -->
  <main id="studentView" class="container hidden">
    <div class="tabs">
      <button class="tab active" data-st="menu">Menu</button>
      <button class="tab" data-st="cart">My Cart <span id="cartCount" class="badge">0</span></button>
      <button class="tab" data-st="orders">My Orders</button>
    </div>
    <section id="st-menu"></section>
    <section id="st-cart" class="hidden"></section>
    <section id="st-orders" class="hidden"></section>
  </main>

  <!-- Admin -->
  <main id="adminView" class="container hidden">
    <div class="tabs">
      <button class="tab active" data-ad="orders">Orders</button>
      <button class="tab" data-ad="menu">Menu &amp; Prices</button>
      <button class="tab" data-ad="finance">Finance</button>
    </div>
    <section id="ad-orders"></section>
    <section id="ad-menu" class="hidden"></section>
    <section id="ad-finance" class="hidden"></section>
  </main>

  <footer>Smart Canteen &mdash; Java (JDBC) + SQLite academic project</footer>
  <script src="config.js"></script>
  <script src="app.js"></script>
</body>
</html>
